name: Google Ads (campañas, productos, búsquedas)

on:
  schedule:
    # cada 2 horas (Google informa la inversión del día casi en vivo)
    - cron: '25 */2 * * *'
  workflow_dispatch:

concurrency:
  group: google-ads
  cancel-in-progress: false

jobs:
  google_ads:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Google Ads
        env:
          GADS_CLIENT_ID: ${{ secrets.GADS_CLIENT_ID }}
          GADS_CLIENT_SECRET: ${{ secrets.GADS_CLIENT_SECRET }}
          GADS_REFRESH_TOKEN: ${{ secrets.GADS_REFRESH_TOKEN }}
          GADS_LOGIN_CUSTOMER_ID: ${{ secrets.GADS_LOGIN_CUSTOMER_ID }}
          GADS_CUENTAS: ${{ secrets.GADS_CUENTAS }}
          TOKEN_REEBOK: ${{ secrets.TOKEN_REEBOK }}
          TOKEN_COLUMBIA: ${{ secrets.TOKEN_COLUMBIA }}
          TOKEN_CROCS: ${{ secrets.TOKEN_CROCS }}
          TOKEN_KAPPA: ${{ secrets.TOKEN_KAPPA }}
          TOKEN_PICCADILLY: ${{ secrets.TOKEN_PICCADILLY }}
        run: python extractor_google_ads.py

      - name: Guardar en GitHub
        run: |
          git config --global user.name "Robot Distrinando"
          git config --global user.email "robot@distrinando.com"
          for f in gads_campanias_diario.csv gads_productos.csv gads_terminos.csv gads_recomendaciones.csv shopify_origen.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "ℹ️ Sin cambios."
            exit 0
          fi
          git commit -m "🔎 Google Ads [$(date +'%d/%m %H:%M')]"
          # el robot de ventas también sube archivos: se reintenta si justo pisó
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
